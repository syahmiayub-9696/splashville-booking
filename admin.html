
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPLASHVILLE Admin</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f2f7fc;
 color:#183451;
 font-family:Arial,sans-serif;
}
header{
 background:linear-gradient(135deg,#086fc1,#00b6df);
 color:white;
 padding:23px;
}
header h1{margin:0 0 10px}
main{
 max-width:1100px;
 margin:25px auto;
 padding:15px;
}
.panel{
 background:white;
 padding:23px;
 border-radius:17px;
 margin-bottom:18px;
 box-shadow:0 5px 22px #12578415;
}
input,select{
 padding:12px;
 border:1px solid #c7d5e1;
 border-radius:9px;
 width:100%;
}
label{
 display:block;
 font-weight:bold;
 margin:10px 0 6px;
}
button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 background:#0879cb;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{
 opacity:.45;
 cursor:not-allowed;
}
button.danger{background:#c93e48}
button.secondary{background:#627a91}
button.success{background:#168653}
button.receipt-btn{background:#6645bd}
.grid,.bookings{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}
.booking{
 border:1px solid #d9e6f1;
 border-radius:14px;
 padding:17px;
 line-height:1.8;
 overflow-wrap:anywhere;
}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:12px;
}
.notice{
 padding:13px;
 background:#e9f6ff;
 border-radius:10px;
 margin:12px 0;
}
.hide{display:none}
.muted{
 color:#60758b;
 font-size:13px;
}
.badge{
 display:inline-block;
 padding:4px 10px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold;
}
.badge.green{
 background:#def8e9;
 color:#147345;
}
.badge.yellow{
 background:#fff2cc;
 color:#946400;
}
.badge.red{
 background:#ffe3e6;
 color:#b12d40;
}
.payment-box{
 margin-top:12px;
 padding:13px;
 background:#f1f9ff;
 border-radius:10px;
}
@media(max-width:700px){
 .grid,.bookings{grid-template-columns:1fr}
 .panel{padding:17px}
}
</style>
</head>

<body>

<header>
<h1>💦 SPLASHVILLE Admin</h1>
<a href="index.html" style="color:white">
 ← Website Pelanggan
</a>
</header>

<main>

<section class="panel" id="login">
<h2>Log Masuk Admin</h2>

<div class="grid">
 <div>
  <label>E-mel Admin</label>
  <input id="email" type="email">
 </div>

 <div>
  <label>Password</label>
  <input id="password" type="password">
 </div>
</div>

<div class="actions">
 <button id="signIn">Log Masuk</button>
</div>
</section>

<section class="panel hide" id="dashboard">
<h2>Dashboard Tempahan</h2>

<div class="actions">
 <button id="refresh">Refresh</button>
 <button id="logout" class="secondary">
  Log Keluar
 </button>
</div>

<div class="grid">
 <div>
  <label>Status Tempahan</label>
  <select id="filter">
   <option value="ALL">Semua</option>
   <option value="PENDING">Pending</option>
   <option value="CONFIRMED">Confirmed</option>
   <option value="CANCELLED">Cancelled</option>
  </select>
 </div>

 <div>
  <label>Cari Nama / Telefon</label>
  <input id="search" placeholder="Cari tempahan">
 </div>
</div>

<p id="count"></p>
<div class="bookings" id="bookings"></div>
</section>

<div class="notice" id="message">
Log masuk menggunakan akaun admin Supabase.
</div>

</main>

<script type="module">

import {createClient} from
"https://esm.sh/@supabase/supabase-js@2";

const db=createClient(
 "https://voegwnwppizteaoqeckk.supabase.co",
 "sb_publishable_G_olNSg_naTLQ7fGEOtwng_dTYDyFfh"
);

const $=id=>document.getElementById(id);

let records=[];
let busy=false;

const names={
 crocodilo:"Crocodilo",
 dolphinita:"Dolphinita",
 shinetrip:"ShineTrip Shelter"
};

const rm=n=>"RM "+Number(n||0).toFixed(2);

const date=v=>new Intl.DateTimeFormat("ms-MY",{
 dateStyle:"medium",
 timeStyle:"short",
 timeZone:"Asia/Kuala_Lumpur"
}).format(new Date(v));

function escapeHTML(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[c]);
}

function msg(s){
 $("message").textContent=s;
}

async function checkLogin(){
 const {data:{session}}=await db.auth.getSession();

 if(!session){
  $("login").classList.remove("hide");
  $("dashboard").classList.add("hide");
  return;
 }

 const {data,error}=await db.from("admins")
 .select("user_id")
 .eq("user_id",session.user.id)
 .maybeSingle();

 if(error||!data){
  await db.auth.signOut();
  $("login").classList.remove("hide");
  $("dashboard").classList.add("hide");
  msg("Akaun ini tiada akses admin.");
  return;
 }

 $("login").classList.add("hide");
 $("dashboard").classList.remove("hide");

 await load();
}

$("signIn").onclick=async()=>{
 msg("Sedang log masuk...");

 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });

 if(error){
  msg(error.message);
  return;
 }

 await checkLogin();
};

$("logout").onclick=async()=>{
 await db.auth.signOut();
 await checkLogin();
};

$("refresh").onclick=load;

async function load(){
 msg("Memuatkan tempahan...");

 const {data,error}=await db.from("bookings")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(500);

 if(error){
  msg("Gagal membaca tempahan: "+error.message);
  return;
 }

 records=data||[];
 render();

 msg("Data berjaya dikemas kini.");
}

function render(){
 const status=$("filter").value;
 const q=$("search").value.toLowerCase();

 const list=records.filter(b=>
  (status==="ALL"||b.booking_status===status) &&
  [b.customer_name,b.phone,b.id].some(v=>
   String(v||"").toLowerCase().includes(q)
  )
 );

 $("count").textContent=list.length+" tempahan";

 const container=$("bookings");
 container.replaceChildren();

 if(!list.length){
  container.textContent="Tiada tempahan.";
  return;
 }

 for(const b of list){
  const card=document.createElement("div");
  card.className="booking";

  const paid=b.full_payment_confirmed===true;
  const cancelled=b.booking_status==="CANCELLED";

  const paymentBadge=cancelled
   ?'<span class="badge red">DIBATALKAN</span>'
   :paid
    ?'<span class="badge green">BAYARAN PENUH</span>'
    :'<span class="badge yellow">BAKI BELUM DISAHKAN</span>';

  const rental=Number(b.rental_price||0);
  const deposit=Number(b.booking_deposit||rental/2);
  const balance=rental-deposit;
  const security=100;
  const total=rental+security;

  card.innerHTML=`
   <b>${escapeHTML(b.customer_name)}</b>

   <p>
    <b>Status Tempahan:</b>
    ${escapeHTML(b.booking_status)}
   </p>

   ${paymentBadge}

   <div>
    ${escapeHTML(names[b.product_id]||b.product_id)}
   </div>

   <div>
    📅 ${date(b.start_at)} → ${date(b.end_at)}
   </div>

   <div>
    📞 ${escapeHTML(b.phone)}
   </div>

   <div>
    📍 ${escapeHTML(b.delivery_address)}
   </div>

   <div class="payment-box">
    <b>Ringkasan Bayaran</b>
    <div>Harga Sewaan: ${rm(rental)}</div>
    <div>Deposit Tempahan: ${rm(deposit)}</div>
    <div>Baki Sewaan: ${rm(balance)}</div>
    <div>Deposit Keselamatan: ${rm(security)}</div>
    <div><b>Jumlah: ${rm(total)}</b></div>
    <div>
     Status Bayaran Awal:
     ${escapeHTML(b.payment_status)}
    </div>
   </div>

   <div class="muted">
    ID: ${escapeHTML(b.id)}
   </div>
  `;

  const actions=document.createElement("div");
  actions.className="actions";

  function add(title,fn,style="",disabled=false){
   const btn=document.createElement("button");
   btn.type="button";
   btn.textContent=title;
   btn.className=style;
   btn.disabled=disabled;
   btn.onclick=fn;
   actions.append(btn);
  }

  add(
   "✓ Sahkan",
   ()=>update(b.id,{
    booking_status:"CONFIRMED",
    payment_status:"VERIFIED"
   }),
   "success",
   cancelled
  );

  add(
   "Bayaran Ditolak",
   ()=>update(b.id,{
    payment_status:"REJECTED"
   }),
   "secondary",
   cancelled||paid
  );

  if(!paid){
   add(
    "💰 Rekod Bayaran Penuh",
    ()=>confirmFullPayment(b),
    "success",
    cancelled||
    b.booking_status!=="CONFIRMED"||
    b.payment_status!=="VERIFIED"
   );
  }else{
   add(
    "↩ Batalkan Status Bayaran Penuh",
    ()=>undoFullPayment(b),
    "secondary",
    cancelled
   );
  }

  add(
   "🧾 Jana Resit PDF",
   ()=>generateReceipt(b),
   "receipt-btn",
   !paid||cancelled
  );

  add("Edit",()=>edit(b),"secondary");

  add("Batal",async()=>{
   if(confirm(
    "Batalkan tempahan ini? Slot akan dibuka semula."
   )){
    await update(b.id,{
     booking_status:"CANCELLED"
    });
   }
  },"danger",cancelled);

  if(b.receipt_path){
   add(
    "Lihat Bukti Bayaran",
    ()=>receipt(b.receipt_path),
    "secondary"
   );
  }

  card.append(actions);
  container.append(card);
 }
}

async function update(id,changes){
 if(busy)return;

 busy=true;

 try{
  const {error}=await db.from("bookings")
   .update(changes)
   .eq("id",id);

  if(error){
   msg("Gagal update: "+error.message);
   return;
  }

  await load();

 }finally{
  busy=false;
 }
}

async function confirmFullPayment(b){
 if(
  b.booking_status!=="CONFIRMED"||
  b.payment_status!=="VERIFIED"
 ){
  msg("Sahkan tempahan dan bayaran awal dahulu.");
  return;
 }

 const rental=Number(b.rental_price||0);
 const deposit=Number(b.booking_deposit||rental/2);
 const balance=rental-deposit;

 const okay=confirm(
  "SAHKAN BAYARAN PENUH\n\n"+
  "Pelanggan: "+b.customer_name+"\n"+
  "Produk: "+(names[b.product_id]||b.product_id)+"\n"+
  "Baki sewaan: "+rm(balance)+"\n\n"+
  "Pastikan baki bayaran telah benar-benar diterima.\n\n"+
  "Teruskan?"
 );

 if(!okay)return;

 await update(b.id,{
  full_payment_confirmed:true,
  full_payment_confirmed_at:new Date().toISOString()
 });
}

async function undoFullPayment(b){
 const okay=confirm(
  "Batalkan pengesahan bayaran penuh untuk "+
  b.customer_name+"?\n\n"+
  "Resit yang pernah dihantar perlu disemak semula."
 );

 if(!okay)return;

 await update(b.id,{
  full_payment_confirmed:false,
  full_payment_confirmed_at:null
 });
}

async function receipt(path){
 const {data,error}=await db.storage
 .from("payment-receipts")
 .createSignedUrl(path,60);

 if(error||!data){
  msg("Gagal buka bukti bayaran.");
  return;
 }

 window.open(data.signedUrl,"_blank","noopener");
}

function generateReceipt(b){
 if(
  b.full_payment_confirmed!==true||
  b.booking_status==="CANCELLED"
 ){
  msg("Resit hanya boleh dijana selepas bayaran penuh disahkan.");
  return;
 }

 const rental=Number(b.rental_price||0);
 const deposit=Number(b.booking_deposit||rental/2);
 const balance=rental-deposit;
 const security=100;
 const total=rental+security;

 const receiptNo="SV-R-"+
  String(b.id).slice(0,8).toUpperCase();

 const receiptDate=b.full_payment_confirmed_at
  ?date(b.full_payment_confirmed_at)
  :date(new Date());

 const productName=names[b.product_id]||b.product_id;

 const html=`
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Resit ${escapeHTML(receiptNo)}</title>

<style>
@page{
 size:A4;
 margin:16mm;
}
*{box-sizing:border-box}
body{
 font-family:Arial,sans-serif;
 margin:0;
 color:#183451;
 background:white;
}
.receipt{
 max-width:760px;
 margin:auto;
 border:1px solid #dceaf5;
 border-radius:14px;
 padding:28px;
}
.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px;
 border-bottom:4px solid #087fd1;
 padding-bottom:18px;
}
.logo{
 width:160px;
 max-height:110px;
 object-fit:contain;
}
.brand{
 font-size:25px;
 font-weight:900;
 color:#087fd1;
}
.small{
 color:#637b91;
 font-size:12px;
 line-height:1.7;
}
.title{
 text-align:center;
 margin:30px 0 20px;
}
.title h1{
 font-size:24px;
 margin:0 0 8px;
}
.status{
 display:inline-block;
 background:#e1f8e9;
 color:#17683d;
 border-radius:30px;
 padding:8px 15px;
 font-weight:bold;
 font-size:12px;
}
.info{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin:24px 0;
}
.info div{
 line-height:1.7;
 font-size:13px;
 overflow-wrap:anywhere;
}
table{
 width:100%;
 border-collapse:collapse;
 margin-top:22px;
}
th{
 background:#087fd1;
 color:white;
 text-align:left;
 padding:12px;
}
td{
 padding:13px 12px;
 border-bottom:1px solid #e3edf5;
 font-size:13px;
}
td:last-child,th:last-child{
 text-align:right;
}
.total td{
 font-weight:900;
 font-size:17px;
 color:#087fd1;
 border-top:2px solid #087fd1;
}
.note{
 margin-top:26px;
 padding:14px;
 background:#eef9ff;
 border-radius:10px;
 font-size:12px;
 line-height:1.7;
}
.footer{
 margin-top:35px;
 text-align:center;
 color:#68849a;
 font-size:12px;
}
.print{
 display:block;
 width:100%;
 border:0;
 border-radius:10px;
 padding:14px;
 background:#087fd1;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 margin-bottom:20px;
}
@media print{
 .print{display:none}
 .receipt{border:0;padding:0}
}
@media(max-width:600px){
 .receipt{padding:16px}
 .info{grid-template-columns:1fr}
 .logo{width:110px}
}
</style>
</head>

<body>

<button class="print" onclick="window.print()">
 🖨️ Cetak / Simpan sebagai PDF
</button>

<div class="receipt">

 <div class="top">
  <div>
   <div class="brand">SPLASHVILLE</div>
   <div class="small">
    INFLATABLE & WATERPLAY RENTAL<br>
    Slide • Splash • Smile!
   </div>
  </div>

  <img
   src="${new URL("logo.png",location.href).href}"
   class="logo"
   alt="SPLASHVILLE"
  >
 </div>

 <div class="title">
  <h1>RESIT PEMBAYARAN</h1>
  <div class="small">
   No. Resit: ${escapeHTML(receiptNo)}
  </div>
  <p>
   <span class="status">BAYARAN PENUH DITERIMA</span>
  </p>
 </div>

 <div class="info">
  <div>
   <b>Nama Pelanggan</b><br>
   ${escapeHTML(b.customer_name)}
  </div>

  <div>
   <b>Tarikh Bayaran Penuh Disahkan</b><br>
   ${escapeHTML(receiptDate)}
  </div>

  <div>
   <b>Produk Sewaan</b><br>
   ${escapeHTML(productName)}
  </div>

  <div>
   <b>Tempoh Sewaan</b><br>
   ${Math.round(
    (new Date(b.end_at)-new Date(b.start_at))/3600000
   )} jam
  </div>

  <div>
   <b>Tarikh & Masa Mula</b><br>
   ${escapeHTML(date(b.start_at))}
  </div>

  <div>
   <b>Tarikh & Masa Tamat</b><br>
   ${escapeHTML(date(b.end_at))}
  </div>

  <div>
   <b>No. Telefon</b><br>
   ${escapeHTML(b.phone)}
  </div>

  <div>
   <b>No. Rujukan Tempahan</b><br>
   ${escapeHTML(b.id)}
  </div>
 </div>

 <table>
  <thead>
   <tr>
    <th>Butiran Pembayaran</th>
    <th>Jumlah</th>
   </tr>
  </thead>

  <tbody>
   <tr>
    <td>Harga Sewaan</td>
    <td>${rm(rental)}</td>
   </tr>

   <tr>
    <td>Deposit Tempahan 50% (Diterima)</td>
    <td>${rm(deposit)}</td>
   </tr>

   <tr>
    <td>Baki Sewaan (Diterima)</td>
    <td>${rm(balance)}</td>
   </tr>

   <tr>
    <td>Deposit Keselamatan (Boleh Dipulangkan)</td>
    <td>${rm(security)}</td>
   </tr>

   <tr class="total">
    <td>JUMLAH BAYARAN DITERIMA</td>
    <td>${rm(total)}</td>
   </tr>
  </tbody>
 </table>

 <div class="note">
  <b>Nota:</b><br>
  Harga sewaan telah dijelaskan sepenuhnya.
  Deposit keselamatan RM100 adalah berasingan
  daripada harga sewaan dan boleh dipulangkan
  tertakluk kepada syarat penyewaan.
  Caj penghantaran, jika ada, tidak termasuk
  dalam jumlah resit ini.
 </div>

 <div class="footer">
  Terima kasih kerana memilih SPLASHVILLE! 💦<br>
  Slide • Splash • Smile!<br><br>
  Resit ini dijana secara elektronik.
 </div>

</div>

</body>
</html>
 `;

 const win=window.open("","_blank");

 if(!win){
  msg("Popup disekat. Benarkan popup untuk jana resit.");
  return;
 }

 win.document.open();
 win.document.write(html);
 win.document.close();
 win.focus();
}

async function edit(b){
 const name=prompt(
  "Nama pelanggan:",
  b.customer_name
 );
 if(name===null)return;

 const phone=prompt(
  "Telefon:",
  b.phone
 );
 if(phone===null)return;

 const address=prompt(
  "Alamat:",
  b.delivery_address
 );
 if(address===null)return;

 const start=prompt(
  "Tarikh mula (YYYY-MM-DD HH:mm, waktu Malaysia):",
  new Intl.DateTimeFormat("sv-SE",{
   timeZone:"Asia/Kuala_Lumpur",
   year:"numeric",
   month:"2-digit",
   day:"2-digit",
   hour:"2-digit",
   minute:"2-digit",
   hour12:false
  }).format(new Date(b.start_at))
 );
 if(start===null)return;

 const duration=prompt(
  "Tempoh sewaan (jam):",
  String(
   (new Date(b.end_at)-new Date(b.start_at))/3600000
  )
 );
 if(duration===null)return;

 const startDate=new Date(
  start.replace(" ","T")+":00+08:00"
 );

 const hours=Number(duration);

 if(
  !name.trim()||
  !phone.trim()||
  !address.trim()||
  !Number.isFinite(startDate.getTime())||
  hours<=0
 ){
  msg("Maklumat edit tidak sah.");
  return;
 }

 await update(b.id,{
  customer_name:name.trim(),
  phone:phone.trim(),
  delivery_address:address.trim(),
  start_at:startDate.toISOString(),
  end_at:new Date(
   startDate.getTime()+hours*3600000
  ).toISOString()
 });
}

$("filter").onchange=render;
$("search").oninput=render;

checkLogin();

</script>
</body>
</html>
